name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Restore and build
      run: |
        cd src/Api
        dotnet restore
        dotnet build --no-restore
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Frontend install
      run: |
        cd frontend
        npm ci
        npm run build
